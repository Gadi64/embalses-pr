name: Actualizar datos
on:
  schedule: [{cron: "7 * * * *"}]
  workflow_dispatch:
    inputs:
      desde: {description: "Cargar histórico desde (AAAA-MM-DD)", required: false}
permissions:
  contents: write
concurrency: {group: actualizar, cancel-in-progress: false}
jobs:
 - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "datos $(date -u +%FT%TZ)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi
